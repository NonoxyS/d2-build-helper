name: Android Checks

on:
  pull_request:
    branches: [ master, develop, develop-cmp ]

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Provision local.properties
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          STRATZ_API_KEY: ${{ secrets.STRATZ_API_KEY }}
        run: |
          cat > local.properties <<EOF
          SUPABASE_API_KEY=${SUPABASE_API_KEY:-ci-stub}
          STRATZ_API_KEY=${STRATZ_API_KEY:-ci-stub}
          EOF

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/detekt.html
          retention-days: 1

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: detekt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Provision local.properties
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          STRATZ_API_KEY: ${{ secrets.STRATZ_API_KEY }}
        run: |
          cat > local.properties <<EOF
          SUPABASE_API_KEY=${SUPABASE_API_KEY:-ci-stub}
          STRATZ_API_KEY=${STRATZ_API_KEY:-ci-stub}
          EOF

      - name: Run Android Lint
        run: ./gradlew :android:app:lintDebug

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 1
