# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G -XX:+UseParallelGC
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
# Workaround for Kotlin/Native cache build failure with Supabase storage-kt on iOS (3.1.0)
kotlin.native.cacheKind=none

# Gradle
org.gradle.jvmargs=-Xmx4G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 + KMP compatibility. Both the legacy DSL (BaseAppModuleExtension/LibraryExtension)
# and the legacy built-in Kotlin path are required because the multi-module KMP setup
# applies com.android.library to KMP modules; the new DSL is incompatible with KMP until
# the build-logic migrates to com.android.kotlin.multiplatform.library.
android.builtInKotlin=false
android.newDsl=false
